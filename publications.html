<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Publications - Data AI Lab @ SNU</title>
    <meta property="og:title" content="Publications - Data AI Lab, SNU" />
    <meta
      property="og:description"
      content="Explore the latest research publications from the Data AI Lab at SNU."
    />
    <meta property="og:image" content="images/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />

    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body class="bg-gray-50 text-gray-800">
    <script src="include-header-footer.js?v=3"></script>

    <!-- Hero Section -->
    <section class="relative flex hero-bg">
      <div class="w-full">
        <div id="site-header"></div>
        <div
          class="container mx-auto px-6 py-6 sm:py-12 text-white text-3xl sm:text-4xl font-bold"
        >
          <span id="page-title">Publications</span>
        </div>
      </div>
    </section>

    <main class="container mx-auto px-6 py-4 sm:py-8">
      <!-- Navigation Tabs -->
      <div class="mb-3 sm:mb-6 border-b border-gray-200">
        <nav class="flex space-x-8" aria-label="Tabs">
          <button
            id="papers-tab"
            class="tab-button active py-2 px-1 border-b-2 text-md sm:text-lg font-semibold"
          >
            Papers
          </button>
          <button
            id="tutorials-tab"
            class="tab-button py-2 px-1 border-b-2 border-transparent text-md sm:text-lgfont-medium text-gray-500 hover:text-gray-700 hover:border-gray-300"
          >
            Tutorials
          </button>
        </nav>
      </div>

      <div id="content-list" class="space-y-3 pb-16"></div>
    </main>

    <div id="site-footer"></div>

    <script src="js/site-security.js"></script>
    <script src="js/publications.js"></script>
  </body>
</html>
